<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Membrane MIISO4 | u</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #0e0e12; color: #eee; }
  header { padding: 10px 16px; border-bottom: 1px solid #2a2a35; display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
  header h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  header .meta { color: #9aa; font-size: 0.85rem; }
  #plot3d { width: 100%; height: calc(100vh - 120px); }
  .controls { position: sticky; bottom: 0; background: #16161d; border-top: 1px solid #2a2a35; padding: 12px 16px 16px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button { background: #2b2b3a; color: #fff; border: 1px solid #3d3d52; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  input[type=range] { flex: 1; min-width: 200px; accent-color: #f49a7b; }
  #timeLabel { font-variant-numeric: tabular-nums; font-size: 1.05rem; min-width: 9rem; color: #f7f7f7; }
  #playRate { width: 5rem; }
</style>
</head>
<body>
<header>
  <h1>Nonlinear IGA membrane — displacement u (MIISO4)</h1>
  <div class="meta">nel=96 · N=9604 · k=388 · L=2 · h=0.00625 · T=2.0s · frames=201</div>
</header>
<div id="plot3d"></div>
<div class="controls">
  <div class="row">
    <button id="btnPlay" type="button">Play</button>
    <label>speed <input id="playRate" type="number" value="1" min="0.1" max="10" step="0.1"/> ×</label>
    <span id="timeLabel">t = 0.00 s</span>
  </div>
  <div class="row">
    <span>0</span>
    <input id="slider" type="range" min="0" max="200" value="0" step="1"/>
    <span>2.0s</span>
  </div>
</div>
<script>
fetch('membrane_video_data.json')
  .then(r => r.json())
  .then(D => {
    let i = 0, playing = false, timer = null;
    function traces(frame) {
      return [{
        type: 'surface', x: D.geom.X, y: D.geom.Y, z: frame.U,
        surfacecolor: frame.C, cmin: 0, cmax: D.umax, colorscale: D.colorscale,
        showscale: true, colorbar: { title: '|u|', len: 0.55 },
        opacity: 0.98, hoverinfo: 'skip', name: 'u'
      }];
    }
    function layout(t) {
      return {
        paper_bgcolor: '#0e0e12', font: { color: '#ddd' },
        margin: { l: 0, r: 0, t: 28, b: 0 },
        title: { text: 'membrane · u · t=' + t.toFixed(3) + 's', font: { size: 14 } },
        scene: {
          xaxis: { title: 'x', gridcolor: '#333', backgroundcolor: '#0e0e12', showbackground: true, range: [0, D.L] },
          yaxis: { title: 'y', gridcolor: '#333', backgroundcolor: '#0e0e12', showbackground: true, range: [0, D.L] },
          zaxis: { title: 'u', gridcolor: '#333', backgroundcolor: '#0e0e12', showbackground: true, range: [-D.umax, D.umax] },
          aspectmode: 'manual', aspectratio: { x: 1.0, y: 1.0, z: 0.55 },
          camera: { eye: { x: 1.4, y: -1.4, z: 0.9 }, up: { x: 0, y: 0, z: 1 } }
        }
      };
    }
    Plotly.newPlot('plot3d', traces(D.frames[0]), layout(D.frames[0].t), { responsive: true });
    const slider = document.getElementById('slider');
    const timeLabel = document.getElementById('timeLabel');
    const btn = document.getElementById('btnPlay');
    const rate = document.getElementById('playRate');
    function show(k) {
      i = k; const f = D.frames[k];
      slider.value = k; timeLabel.textContent = 't = ' + f.t.toFixed(3) + ' s';
      Plotly.restyle('plot3d', { z: [f.U], surfacecolor: [f.C] });
      Plotly.relayout('plot3d', { 'title.text': 'membrane · u · t=' + f.t.toFixed(3) + 's' });
    }
    slider.addEventListener('input', () => show(+slider.value));
    function tick() {
      if (!playing) return;
      show((i + 1) % D.frames.length);
      timer = setTimeout(tick, Math.max(20, 50 / Math.max(0.1, +rate.value)));
    }
    btn.addEventListener('click', () => {
      playing = !playing; btn.textContent = playing ? 'Pause' : 'Play';
      if (playing) tick(); else if (timer) clearTimeout(timer);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ') { e.preventDefault(); btn.click(); }
      if (e.key === 'ArrowRight') show(Math.min(i + 1, D.frames.length - 1));
      if (e.key === 'ArrowLeft') show(Math.max(i - 1, 0));
    });
  })
  .catch(err => {
    document.body.innerHTML = '<pre style="padding:2rem;color:#f66">Failed to load data\n' + err + '</pre>';
  });
</script>
</body>
</html>
